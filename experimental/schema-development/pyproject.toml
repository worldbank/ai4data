[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-development"
version = "0.1.0"
description = "Reproducibility code for artifact-driven metadata schema development"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openai==2.36.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1",
    "tabulate>=0.9",
    "tqdm>=4.67",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=6", "jupyterlab>=4"]
dev = ["black==25.1.0", "pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
