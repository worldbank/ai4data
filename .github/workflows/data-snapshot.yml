name: Data Snapshot

on:
  push:
    branches: [main]
    paths:
      - "src/ai4data/**"
      - "tests/data_snapshot/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/data-snapshot.yml"
  pull_request:
    paths:
      - "src/ai4data/**"
      - "tests/data_snapshot/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/data-snapshot.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and source distribution
        run: |
          pip install build
          python -m build
      - name: Install wheel with test dependencies
        run: |
          for wheel in dist/*.whl; do
            pip install "${wheel}[data-snapshot-metadata]" pytest
          done
      - name: Test offline from the installed package
        run: python -m pytest tests/data_snapshot -q
